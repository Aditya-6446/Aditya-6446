<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Aditya Sharma, data analyst</title>
  <desc id="desc">Dark editorial banner with pale green orbit lines and the words A clearer view of the data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="1" y2="0">
      <stop stop-color="#182724"/>
      <stop offset="1" stop-color="#29443d"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#a9cab8" opacity=".18"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="290" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="290" fill="url(#bg)"/>
    <rect width="1200" height="290" fill="url(#dots)" opacity=".6"/>
    <circle cx="1035" cy="139" r="237" fill="none" stroke="#a8cec0" stroke-opacity=".25"/>
    <circle cx="1035" cy="139" r="167" fill="none" stroke="#a8cec0" stroke-opacity=".35"/>
    <circle cx="1035" cy="139" r="98" fill="none" stroke="#a8cec0" stroke-opacity=".25"/>
    <circle cx="927" cy="12" r="5" fill="#a8cec0"/>
    <circle cx="927" cy="12" r="16" fill="#a8cec0" fill-opacity=".12"/>
    <path d="M39 39h47" stroke="#a8cec0" stroke-width="3"/>
    <text x="104" y="44" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3.3" fill="#bad7c8">ADITYA SHARMA  /  DATA ANALYST</text>
    <text x="43" y="166" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="500" letter-spacing="-2.5" fill="#f4f4ed">A clearer view</text>
    <text x="43" y="226" font-family="Georgia, Times New Roman, serif" font-size="58" font-style="italic" letter-spacing="-2" fill="#b6d9c7">of the data.</text>
    <path d="M43 256h650" stroke="#dcece0" stroke-opacity=".24"/>
    <text x="710" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#bdd4c6">FINANCE  ·  RESEARCH  ·  ANALYTICS</text>
  </g>
</svg>
